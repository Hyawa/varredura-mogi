<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="titulo-logo">
  <title id="titulo-logo">Varredura Mogi</title>

  <!--
    Identidade do app: o mesmo radar do painel de veredito (src/ui/componentes/PainelVeredito.tsx).
    Três anéis, eixos, um leque de varredura de 60° e um "blip" âmbar = uma inscrição encontrada.
    Paleta igual à da interface: fundo #0b1220/#16213a, verde #34d399, âmbar #fbbf24.
  -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16213a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="leque" x1="64" y1="64" x2="101" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.40"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#fundo)"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="28.5" fill="none" stroke="#e2e8f0" stroke-opacity="0.10" stroke-width="1.5"/>

  <g fill="none" stroke="#34d399">
    <circle cx="64" cy="64" r="43" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="64" cy="64" r="30" stroke-opacity="0.24" stroke-width="2"/>
    <circle cx="64" cy="64" r="17" stroke-opacity="0.32" stroke-width="2"/>
  </g>

  <g stroke="#34d399" stroke-opacity="0.10" stroke-width="1.5">
    <path d="M64 17v94"/>
    <path d="M17 64h94"/>
  </g>

  <!-- leque de varredura: de -90° a -30° -->
  <path d="M64 64 L64 21 A43 43 0 0 1 101.2 42.5 Z" fill="url(#leque)"/>
  <path d="M64 64 L101.2 42.5" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>

  <!-- inscrição encontrada -->
  <circle cx="84" cy="47" r="10" fill="none" stroke="#fbbf24" stroke-opacity="0.40" stroke-width="1.5"/>
  <circle cx="84" cy="47" r="4.5" fill="#fbbf24"/>

  <circle cx="64" cy="64" r="3.5" fill="#e2e8f0"/>
</svg>
